    <main>

        

        <section class="topics" id="contact">
            <div class="container">

                <h2>Contact Us</h2>
                <p>Have a question or feedback? Fill out the form below and we will get back to you.</p>

                
<form class="card" action="https://httpbin.org/post" method="post">

    <label for="name">Name</label>
    <input
        type="text"
        id="name"
        name="name"
        autocomplete="name"
        required
    >

    <label for="email">Email address</label>
    <input
        type="email"
        id="email"
        name="email"
        autocomplete="email"
        required
    >

    <label for="phone">Phone number</label>
    <input
        type="tel"
        id="phone"
        name="phone"
        autocomplete="tel"
    >

    <label for="subject">Contact subject</label>
    <select id="subject" name="subject" required>
        <option value="">Choose a subject</option>
        <option value="feedback">Feedback</option>
        <option value="question">Question</option>
        <option value="other">Other</option>
    </select>

    <p>Preferred contact method</p>

    <label>
        <input type="radio" name="contact_method" value="email" checked>
        Email
    </label>

    <label>
        <input type="radio" name="contact_method" value="phone">
        Phone
    </label>

    <label for="message">Message</label>
    <textarea
        id="message"
        name="message"
        rows="6"
        required
    ></textarea>

    <button type="submit" class="button">Send message</button>

</form>

            </div>
        </section>

    </main>
